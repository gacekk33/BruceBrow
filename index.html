<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BruceBrow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Karty -->
    <div class="tabs">

        <div class="tab active">
            <span class="tab-icon">•••</span>
            <span class="tab-title">Wyszukiwanie</span>
            <button class="close-tab">×</button>
        </div>

        <button class="new-tab">+</button>

    </div>


    <!-- Pasek przeglądarki -->
    <div class="browser-bar">

        <div class="navigation">

            <button class="nav-button" id="back">←</button>
            <button class="nav-button" id="forward">→</button>
            <button class="nav-button" id="reload">⟳</button>

        </div>


        <div class="address-container">

            <span class="address-icon">🔍</span>

            <input
                type="text"
                id="address-input"
                placeholder="Wyszukaj lub wpisz adres"
                autocomplete="off"
            >

        </div>


        <button class="menu-button">⋮</button>

    </div>


    <!-- Zawartość nowej karty -->
    <main>

        <div class="new-tab-page">

            <div class="google-card">

                <div class="google-logo">
                    Google
                </div>

                <div class="google-search">

                    <span>🔍</span>

                    <input
                        type="text"
                        id="google-input"
                        placeholder="Wyszukaj w Google"
                        autocomplete="off"
                    >

                </div>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
